[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adidas-to-strava"
version = "0.1.0"
description = "Convert adidas Running/Runtastic exports to Strava-importable TCX files"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "adidas-to-strava contributors"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
