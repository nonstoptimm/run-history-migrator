[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adidas-to-strava"
version = "0.2.0"
description = "Convert adidas Running exports to TCX and optionally upload them to Strava"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "adidas-to-strava contributors"}]
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
    "types-requests>=2.33.0.20260712,<3",
]

[project.scripts]
adidas-to-strava = "adidas_to_strava.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
